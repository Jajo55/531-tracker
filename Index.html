<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>5/3/1 Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0F0F0F; color: #E8E8E8; font-family: 'Courier New', monospace; min-height: 100vh; }
  button { font-family: 'Courier New', monospace; cursor: pointer; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY = "531-tracker-v6";
const weeks = [
  { label: "Week 1 — 5s",    sets: [{pct:0.65,reps:"5"},{pct:0.75,reps:"5"},{pct:0.85,reps:"5+"}] },
  { label: "Week 2 — 3s",    sets: [{pct:0.70,reps:"3"},{pct:0.80,reps:"3"},{pct:0.90,reps:"3+"}] },
  { label: "Week 3 — 5/3/1", sets: [{pct:0.75,reps:"5"},{pct:0.85,reps:"3"},{pct:0.95,reps:"1+"}] },
  { label: "Week 4 — Deload", sets: [{pct:0.40,reps:"5"},{pct:0.50,reps:"5"},{pct:0.60,reps:"5"}] },
];
const weekColors  = ["#C8F0D4","#FFE8A3","#FFD0C0","#D0E8FF"];
const weekAccents = ["#1A7A3A","#B07800","#C03010","#1A50A0"];
const round5 = n => Math.round(n / 5) * 5;
const epley  = (w, r) => Math.round(w * (1 + r / 30));
const tmFrom = rm => round5(rm * 0.9);
const buildProgram = t => weeks.map(w => ({...w, sets: w.sets.map(s => ({...s, weight: round5(t * s.pct)}))}));
const DEFAULT_STATE = {
  lift: "bench", activeWeek: 0, completedSets: {}, repLogs: {},
  benchTM: 190, squatTM: 306,
  nextBenchTM: 195, nextSquatTM: 316,
  benchNewRM: null, squatNewRM: null,
};
let state = { ...DEFAULT_STATE };
function saveState() {
  const s = JSON.stringify(state);
  try { localStorage.setItem(STORAGE_KEY, s); } catch(e) {}
  try { history.replaceState(null, '', '#' + btoa(unescape(encodeURIComponent(s)))); } catch(e) {}
  showStatus("● saved ✓", "#1A7A3A");
}
function loadState() {
  try {
    const hash = location.hash.slice(1);
    if (hash) { const p = JSON.parse(decodeURIComponent(escape(atob(hash)))); if (p && typeof p === 'object') { state = {...DEFAULT_STATE, ...p}; return; } }
  } catch(e) {}
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') { state = {...DEFAULT_STATE, ...p}; return; } }
  } catch(e) {}
}
let flashTimer;
function showStatus(msg, color) {
  clearTimeout(flashTimer);
  const el = document.getElementById("save-status");
  if (el) { el.textContent = msg; el.style.color = color; }
  flashTimer = setTimeout(() => { const el = document.getElementById("save-status"); if (el) { el.textContent = "● auto-save on"; el.style.color = "#333"; } }, 2000);
}
function currentTM() { return state.lift === "bench" ? state.benchTM : state.squatTM; }
function prog() { return buildProgram(currentTM()); }
function isCompleted(wi, si) { return !!state.completedSets[`${state.lift}-${wi}-${si}`]; }
function getReps(wi, si) { return state.repLogs[`${state.lift}-${wi}-${si}-reps`] ?? ""; }
function weekProgress(wi) {
  const p = prog();
  return { done: p[wi].sets.filter((_,si) => isCompleted(wi,si)).length, total: p[wi].sets.length };
}
function getEst1RM(wi) {
  const sets = prog()[wi].sets; const last = sets.length - 1;
  const r = Number(getReps(wi, last));
  return r >= 1 ? epley(sets[last].weight, r) : null;
}
function updateNextCycle(wi) {
  const est = getEst1RM(wi); if (!est) return;
  const newTM = tmFrom(est);
  if (state.lift === "bench" && newTM > state.benchTM) { state.benchNewRM = est; state.nextBenchTM = newTM + 5; }
  else if (state.lift === "squat" && newTM > state.squatTM) { state.squatNewRM = est; state.nextSquatTM = newTM + 10; }
}
window.toggleSet = function(wi, si) {
  const key = `${state.lift}-${wi}-${si}`;
  state.completedSets[key] = !state.completedSets[key];
  saveState(); render();
};
window.changeReps = function(wi, si, delta) {
  const key = `${state.lift}-${wi}-${si}-reps`;
  state.repLogs[key] = Math.max(0, Number(state.repLogs[key] || 0) + delta);
  updateNextCycle(wi); saveState(); render();
};
window.setLift = function(l) { state.lift = l; saveState(); render(); };
window.setWeek = function(w) { state.activeWeek = w; saveState(); render(); };
function render() {
  const p = prog(); const aw = state.activeWeek;
  const wc = weekColors[aw]; const wa = weekAccents[aw];
  const setsHTML = p[aw].sets.map((s, si) => {
    const done = isCompleted(aw, si); const isAmrap = s.reps.includes("+");
    const isLast = si === p[aw].sets.length - 1; const reps = getReps(aw, si);
    const bg = done ? wc : "#1A1A1A"; const border = done ? `2px solid ${wa}` : "2px solid #2A2A2A";
    const tc = done ? wa : "#E8E8E8"; const lc = done ? wa : "#444";
    const br = (isLast && isAmrap) ? "4px 4px 0 0" : "4px";
    const r = Number(getReps(aw, si));
    const est = (isLast && isAmrap && r >= 1) ? epley(s.weight, r) : null;
    const improved = est && (state.lift === 'bench' ? tmFrom(est) > state.benchTM : tmFrom(est) > state.squatTM);
    const nextTM = improved ? (state.lift === 'bench' ? state.nextBenchTM : state.nextSquatTM) : null;
    return `
      <div style="margin-bottom:10px">
        <button onclick="toggleSet(${aw},${si})" style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 20px;background:${bg};border:${border};border-radius:${br};cursor:pointer;text-align:left;box-sizing:border-box;">
          <div>
            <div style="font-size:11px;color:${lc};letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">Set ${si+1} · ${Math.round(s.pct*100)}%</div>
            <div style="display:flex;align-items:baseline;gap:12px;">
              <div style="font-size:28px;font-weight:900;color:${tc};line-height:1;letter-spacing:-1px;">${s.weight} <span style="font-size:14px;font-weight:400;">lbs</span></div>
              <div style="font-size:22px;font-weight:900;color:${lc};letter-spacing:-1px;">× ${s.reps}</div>
            </div>
            ${isAmrap ? `<div style="font-size:10px;color:${done?wa:'#555'};margin-top:4px;letter-spacing:1px;">AMRAP — leave 1-2 in tank</div>` : ''}
          </div>
          <div style="width:36px;height:36px;border-radius:50%;background:${done?wa:'#222'};border:${done?'none':'2px solid #333'};display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:#0F0F0F;">${done?"✓":""}</div>
        </button>
        ${isLast && isAmrap ? `
        <div style="background:#141414;border:${done?`2px solid ${wa}`:'2px solid #2A2A2A'};border-top:1px solid #222;border-radius:0 0 4px 4px;padding:12px 20px;box-sizing:border-box;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;">Reps done</div>
            <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
              <button onclick="changeReps(${aw},${si},-1)" style="width:44px;height:44px;border-radius:50%;background:#222;border:1px solid #333;color:#888;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button>
              <div style="font-size:28px;font-weight:900;min-width:48px;text-align:center;color:${reps!==''?(done?wa:'#E8E8E8'):'#333'};letter-spacing:-1px;">${reps!==''?reps:'—'}</div>
              <button onclick="changeReps(${aw},${si},1)" style="width:44px;height:44px;border-radius:50%;background:#222;border:1px solid #333;color:#888;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>
            </div>
          </div>
          ${est ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid #222;display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;">Est. 1RM</div>
              <div style="font-size:22px;font-weight:900;color:${improved?'#1A7A3A':wa};letter-spacing:-1px;">${est} <span style="font-size:11px;font-weight:400;">lbs</span>${improved?' <span style="font-size:11px;color:#1A7A3A;">↑ PR</span>':''}</div>
            </div>
            ${nextTM ? `<div style="text-align:right;">
              <div style="font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;">Next TM</div>
              <div style="font-size:22px;font-weight:900;color:#1A7A3A;letter-spacing:-1px;">${nextTM} <span style="font-size:11px;font-weight:400;">lbs</span></div>
            </div>` : ''}
          </div>` : ''}
        </div>` : ''}
      </div>`;
  }).join('');
  const { done: wDone, total: wTotal } = weekProgress(aw);
  const isDeload = aw === 3; const est = getEst1RM(aw);
  const bannerHTML = (wDone === wTotal) ? `
    <div style="margin-top:12px;background:${wc};border:2px solid ${wa};border-radius:4px;overflow:hidden;">
      <div style="padding:14px 20px;text-align:center;font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:${wa};border-bottom:${est&&!isDeload?`1px solid ${wa}44`:'none'};">Week Complete ✓</div>
      ${est&&!isDeload?`<div style="padding:16px 20px;">
        <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:${wa};opacity:0.7;margin-bottom:12px;">Estimated 1RM — Epley Formula</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;">
          <div>
            <div style="font-size:10px;color:${wa};opacity:0.6;margin-bottom:3px;letter-spacing:1px;text-transform:uppercase;">${state.lift}</div>
            <div style="font-size:42px;font-weight:900;color:${wa};letter-spacing:-2px;line-height:1;">${est}<span style="font-size:18px;font-weight:400;margin-left:4px;">lbs</span></div>
          </div>
          <div style="text-align:right;opacity:0.55;">
            <div style="font-size:10px;color:${wa};letter-spacing:1px;">${getReps(aw,p[aw].sets.length-1)} reps @ ${p[aw].sets[p[aw].sets.length-1].weight} lbs</div>
            <div style="font-size:10px;color:${wa};margin-top:3px;font-style:italic;">w × (1 + r / 30)</div>
          </div>
        </div>
      </div>`:''}
    </div>` : '';
  const weekTabs = p.map((w, wi) => {
    const { done, total } = weekProgress(wi); const isActive = wi === aw;
    return `<button onclick="setWeek(${wi})" style="flex:1;padding:12px 4px;background:${isActive?weekColors[wi]:'transparent'};color:${isActive?weekAccents[wi]:'#444'};border:none;border-bottom:${isActive?`3px solid ${weekAccents[wi]}`:'3px solid transparent'};font-size:10px;font-family:'Courier New',monospace;font-weight:900;letter-spacing:1px;text-transform:uppercase;cursor:pointer;line-height:1.4;"><div>W${wi+1}</div><div style="font-size:9px;opacity:0.7;margin-top:2px;">${done}/${total}</div></button>`;
  }).join('');
  const benchUpdated = !!state.benchNewRM; const squatUpdated = !!state.squatNewRM;
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;background:#0F0F0F;">
      <div style="border-bottom:3px solid #333;padding:28px 24px 20px;background:#111;">
        <div style="font-size:11px;letter-spacing:4px;color:#666;margin-bottom:6px;text-transform:uppercase;">Wendler</div>
        <div style="font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1;">5 / 3 / 1</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
          <div style="font-size:12px;color:#555;letter-spacing:2px;">BENCH & SQUAT</div>
          <div id="save-status" style="font-size:9px;letter-spacing:1px;color:#333;">● auto-save on</div>
        </div>
      </div>
      <div style="display:flex;border-bottom:2px solid #222;">
        <button onclick="setLift('bench')" style="flex:1;padding:16px;background:${state.lift==='bench'?'#E8E8E8':'transparent'};color:${state.lift==='bench'?'#0F0F0F':'#555'};border:none;font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;">BENCH</button>
        <button onclick="setLift('squat')" style="flex:1;padding:16px;background:${state.lift==='squat'?'#E8E8E8':'transparent'};color:${state.lift==='squat'?'#0F0F0F':'#555'};border:none;font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;">SQUAT</button>
      </div>
      <div style="padding:14px 24px;background:#161616;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:11px;color:#555;letter-spacing:2px;text-transform:uppercase;">Training Max</span>
        <span style="font-size:20px;font-weight:900;">${currentTM()} <span style="font-size:12px;color:#555;">lbs</span></span>
      </div>
      <div style="display:flex;border-bottom:1px solid #222;">${weekTabs}</div>
      <div style="padding:20px 16px;">
        <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:${wa};margin-bottom:16px;padding-left:4px;">${p[aw].label}</div>
        ${setsHTML}
        ${bannerHTML}
      </div>
      <div style="margin:0 16px 32px;padding:16px 20px;background:#161616;border:1px solid #222;border-radius:4px;">
        <div style="font-size:10px;letter-spacing:3px;color:#444;text-transform:uppercase;margin-bottom:14px;">Next Cycle TM</div>
        <div style="display:flex;justify-content:space-between;gap:12px;">
          <div style="flex:1;padding:12px 14px;background:#1A1A1A;border:1px solid ${benchUpdated?'#1A7A3A':'#222'};border-radius:4px;">
            <div style="font-size:10px;color:#555;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase;">Bench</div>
            <div style="font-size:22px;font-weight:900;color:${benchUpdated?'#1A7A3A':'#888'};">${state.nextBenchTM} <span style="font-size:11px;font-weight:400;">lbs</span></div>
            <div style="font-size:9px;color:${benchUpdated?'#1A7A3A':'#444'};margin-top:3px;">${benchUpdated?`↑ new 1RM ${state.benchNewRM} lbs`:'standard +5 lb'}</div>
          </div>
          <div style="flex:1;padding:12px 14px;background:#1A1A1A;border:1px solid ${squatUpdated?'#1A7A3A':'#222'};border-radius:4px;">
            <div style="font-size:10px;color:#555;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase;">Squat</div>
            <div style="font-size:22px;font-weight:900;color:${squatUpdated?'#1A7A3A':'#888'};">${state.nextSquatTM} <span style="font-size:11px;font-weight:400;">lbs</span></div>
            <div style="font-size:9px;color:${squatUpdated?'#1A7A3A':'#444'};margin-top:3px;">${squatUpdated?`↑ new 1RM ${state.squatNewRM} lbs`:'standard +10 lb'}</div>
          </div>
        </div>
      </div>
    </div>`;
}
loadState();
render();
</script>
</body>
</html>
